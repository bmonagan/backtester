[project]
name = "backtester"
version = "0.2.0"
description = "tiny OHLC backtester"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "bmonagan", email = "bernardmonagan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "yfinance>=0.2.0",
    "pytest>=8.0",
]

[project.scripts]
backtester = "backtester.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
